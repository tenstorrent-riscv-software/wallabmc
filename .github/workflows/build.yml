name: Build WallaBMC

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * 5'
  workflow_dispatch:

permissions:
  contents: read
  # To fetch the size numbers of main's build
  actions: read

jobs:
  check-spdx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check SPDX licenses
        uses: tenstorrent/tt-github-actions/.github/actions/spdx-checker@5f18fe6f86d825c87924d5559ac442ac7eca534f # main
        with:
          verbose: 'true'
          ignore_config_file: .github/spdx-ignore.yaml

  build:
    needs: check-spdx

    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zephyrproject-rtos/ci-repo-cache:v0.29.4.20260912

    strategy:
      matrix:
        include:
          - board: nucleo_f767zi
            name: nucleo_f767zi
          - board: nucleo_f767zi/stm32f767xx/atlantis
            name: nucleo_f767zi_atlantis
          - board: nucleo_f756zg
            name: nucleo_f756zg
          - board: hifive_premier_p550_mcu
            name: hifive_premier_p550_mcu
          - board: atlantis_slt_mcu
            name: atlantis_slt_mcu
          - board: atlantis_evb_mcu
            name: atlantis_evb_mcu
          - board: qemu_cortex_m3
            name: qemu_cortex_m3
          - board: xiao_esp32c6/esp32c6/hpcore
            name: xiao_esp32c6

    env:
      CMAKE_PREFIX_PATH: /opt/toolchains
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr
      BOARD: ${{ matrix.board }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: wallabmc

      - name: Detect Zephyr SDK
        run: |
          SDK_PATH=$(find /opt/toolchains -maxdepth 1 -type d -name "zephyr-sdk-*" | head -n 1)
          if [ -z "$SDK_PATH" ]; then
            echo "Error: Could not find Zephyr SDK in /opt/toolchains"
            exit 1
          fi
          echo "ZEPHYR_SDK_INSTALL_DIR=$SDK_PATH" >> "$GITHUB_ENV"

      - name: Create Workspace Directory
        run: mkdir workspace

      - name: Cache West Modules
        uses: actions/cache@v6
        env:
          cache-name: cache-zephyr-modules
        with:
          path: workspace
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('wallabmc/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-

      - name: Initialize West Workspace
        run: |
          cd workspace
          # Remove old .west config if it exists from cache to avoid conflicts
          rm -rf .west

          # Initialize using the wallabmc repo as the manifest
          west init -l ../wallabmc

          # Update modules (fetches Zephyr kernel, HAL_STM32, etc.)
          west update --path-cache /repo-cache/zephyrproject --narrow -o=--depth=10000 -o=--tags

      - name: Fetch Espressif Blobs
        if: ${{ matrix.name == 'xiao_esp32c6' }}
        working-directory: workspace
        run: west blobs fetch hal_espressif

      - name: Build WallaBMC (sysbuild boards)
        if: ${{ matrix.name != 'qemu_cortex_m3' && matrix.name != 'xiao_esp32c6' }}
        working-directory: workspace
        shell: bash
        run: |
          west build --sysbuild -p always -b "$BOARD" ../wallabmc 2>&1 | tee build.log
          for report in rom_report ram_report; do
            west build -t $report --domain wallabmc > $report.log 2>&1 || {
              echo "::warning::$report failed for $BOARD"
              cat $report.log
            }
          done
          python3 ../wallabmc/scripts/size_report.py collect \
            --board ${{ matrix.name }} --log build.log \
            --image wallabmc=build/wallabmc --image mcuboot=build/mcuboot \
            -o size-${{ matrix.name }}.json
          mv build/mcuboot/zephyr/zephyr.hex build/mcuboot.hex
          mv build/mcuboot/zephyr/zephyr.bin build/mcuboot.bin
          mv build/mcuboot/zephyr/zephyr.elf build/mcuboot.elf
          mv build/wallabmc/zephyr/zephyr.hex build/wallabmc.hex
          mv build/wallabmc/zephyr/zephyr.bin build/wallabmc.bin
          mv build/wallabmc/zephyr/zephyr.elf build/wallabmc.elf
          mv build/wallabmc/zephyr/zephyr.signed.hex build/wallabmc.signed.hex
          mv build/wallabmc/zephyr/zephyr.signed.bin build/wallabmc.signed.bin

      - name: Build WallaBMC (no-sysbuild boards)
        if: ${{ matrix.name == 'qemu_cortex_m3' || matrix.name == 'xiao_esp32c6' }}
        working-directory: workspace
        shell: bash
        run: |
          # qemu_cortex_m3 and xiao_esp32c6 are listed in NO_SYSBUILD_BOARDS;
          # xiao uses Espressif Simple Boot rather than MCUboot.
          west build -p always -b "$BOARD" ../wallabmc 2>&1 | tee build.log
          for report in rom_report ram_report; do
            west build -t $report > $report.log 2>&1 || {
              echo "::warning::$report failed for $BOARD"
              cat $report.log
            }
          done
          python3 ../wallabmc/scripts/size_report.py collect \
            --board ${{ matrix.name }} --log build.log \
            --image wallabmc=build \
            -o size-${{ matrix.name }}.json

      - name: Upload Size Data
        uses: actions/upload-artifact@v7
        with:
          name: size-${{ matrix.name }}
          path: workspace/size-${{ matrix.name }}.json

      - name: Upload Sysbuild Firmware
        if: ${{ matrix.name != 'qemu_cortex_m3' && matrix.name != 'xiao_esp32c6' }}
        uses: actions/upload-artifact@v7
        with:
          name: wallabmc-firmware-${{ matrix.name }}
          path: |
            workspace/build/mcuboot.hex
            workspace/build/mcuboot.bin
            workspace/build/mcuboot.elf
            workspace/build/wallabmc.hex
            workspace/build/wallabmc.bin
            workspace/build/wallabmc.elf
            workspace/build/wallabmc.signed.hex
            workspace/build/wallabmc.signed.bin

      - name: Upload No-Sysbuild Firmware
        if: ${{ matrix.name == 'qemu_cortex_m3' || matrix.name == 'xiao_esp32c6' }}
        uses: actions/upload-artifact@v7
        with:
          name: wallabmc-firmware-${{ matrix.name }}
          path: |
            workspace/build/zephyr/zephyr.bin
            workspace/build/zephyr/zephyr.elf

      # The West module cache saves the whole workspace when the job ends.
      # The build directory holds the generated MCUboot signing key, which
      # pull requests from forks could then restore from the cache.
      - name: Remove Build Directory
        if: ${{ always() }}
        run: rm -rf workspace/build

  size-report:
    runs-on: ubuntu-latest

    needs: build

    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      # What this build should be compared against: the tip of main for a
      # pull request, the previous commit for a push to main. Other builds
      # are compared against whatever main's newest build is.
      BASE_SHA: ${{ github.event.pull_request.base.sha || (github.ref == 'refs/heads/main' && github.event.before) || '' }}
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Size Data
        uses: actions/download-artifact@v8
        with:
          pattern: size-*
          path: sizes/head
          merge-multiple: true

      - name: Fetch Baseline From main
        run: |
          # The baseline is whatever the build of main last uploaded, so it
          # moves forward each time something is merged. Prefer the run for
          # the exact base commit, and fall back to the newest one.
          mkdir -p sizes/base
          # Not being able to ask is not worth failing the build over.
          if ! runs=$(gh api "repos/$REPO/actions/workflows/build.yml/runs?branch=main&status=success&per_page=50"); then
            echo "::warning::Could not list the builds of main, reporting without a baseline"
            runs='{}'
          fi
          run=$(jq -c --arg sha "$BASE_SHA" '
            [(.workflow_runs // [])[] | select(.event == "push" or .event == "schedule")] |
            (map(select(.head_sha == $sha))[0] // .[0] // empty) |
            {id, head_sha}' <<<"$runs")
          base_sha=
          if [ -n "$run" ]; then
            id=$(jq -r .id <<<"$run")
            if gh run download "$id" --repo "$REPO" --pattern 'size-*' --dir sizes/base; then
              base_sha=$(jq -r .head_sha <<<"$run")
            else
              echo "Run $id on main has no size data"
            fi
          else
            echo "No successful build of main found"
          fi
          if [ -n "$BASE_SHA" ] && [ -n "$base_sha" ] && [ "$base_sha" != "$BASE_SHA" ]; then
            echo "::notice::No finished build of $BASE_SHA, comparing with main at $base_sha instead"
          fi
          jq -n --arg pr "$PR_NUMBER" --arg sha "$base_sha" --arg wanted "$BASE_SHA" \
            '{pr: (($pr | tonumber?) // null), base_sha: $sha, wanted_sha: $wanted}' > sizes/meta.json
          cat sizes/meta.json

      - name: Summarise
        run: |
          python3 scripts/size_report.py compare --full \
            --head sizes/head --base sizes/base \
            --base-sha "$(jq -r .base_sha sizes/meta.json)" \
            --wanted-base-sha "$(jq -r .wanted_sha sizes/meta.json)" >> "$GITHUB_STEP_SUMMARY"

      # A pull request from a fork cannot comment on itself. The Size Comment
      # workflow picks this up and does it.
      - name: Upload Report Data
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: pr-size-report
          path: sizes

  test:
    runs-on: ubuntu-latest

    needs: build
    if: needs.build.result == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: wallabmc

      - name: Install Dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get install -qq telnet qemu-system-arm

      - name: Download QEMU Firmware
        uses: actions/download-artifact@v8
        with:
          name: wallabmc-firmware-qemu_cortex_m3
          path: firmware

      - name: Run QEMU Test
        run: |
          python3 wallabmc/scripts/run_qemu_ci.py firmware/zephyr.elf
