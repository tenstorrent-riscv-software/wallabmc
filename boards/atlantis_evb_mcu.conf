# Gentoo mode
CONFIG_SPEED_OPTIMIZATIONS=y

CONFIG_APP_SENSORS=y

# Five TCP listeners: HTTP, HTTPS, two consoles and the JTAG chain
CONFIG_NET_MAX_CONTEXTS=14
CONFIG_NET_MAX_CONN=18

# Redfish system overview (board-specific)
CONFIG_REDFISH_SYSTEM_PRODUCT_NAME="Atlantis EVB"
CONFIG_REDFISH_SYSTEM_MANUFACTURER="Tenstorrent"
CONFIG_REDFISH_SYSTEM_MODEL="Atlantis EVB"
CONFIG_REDFISH_SYSTEM_PROCESSOR_MODEL="Tenstorrent Atlantis"

# The STM32F7 have I and D caches
CONFIG_CACHE_MANAGEMENT=y
