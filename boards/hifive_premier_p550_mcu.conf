CONFIG_APP_HTTPS=n

# RAM is over 90% used here. The NTP DNS send on STM32 Ethernet at -Os
# is about 1.2 KB static by -fstack-usage (1.45 KB if the Ethernet
# driver's error path logs) plus 56 B of TLS and a 32 B exception
# frame, so the paper worst case is tight; the high-water mark on
# hardware is 1184 B. The same work ran in the 1536 B MPU guarded
# system workqueue before it moved.
CONFIG_APP_BLOCKING_WORKQUEUE_STACK_SIZE=1536

# Redfish system overview (board-specific)
CONFIG_REDFISH_SYSTEM_PRODUCT_NAME="HiFive Premier P550"
CONFIG_REDFISH_SYSTEM_MANUFACTURER="SiFive"
CONFIG_REDFISH_SYSTEM_MODEL="HiFive Premier P550"
CONFIG_REDFISH_SYSTEM_PROCESSOR_MODEL="SiFive P550"
CONFIG_REDFISH_SYSTEM_PROCESSOR_COUNT=8
CONFIG_REDFISH_SYSTEM_MEMORY_GIB=16
