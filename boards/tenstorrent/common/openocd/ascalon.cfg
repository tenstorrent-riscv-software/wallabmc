#
# Atlantis Ascalon cluster (SoC chain JTAG1) through the WallaBMC bit-bang
# daemon, which points the board mux at the MCU while OpenOCD is
# connected. This is the default chain: it keeps OpenOCD's default gdb,
# telnet and tcl ports.
#
#   openocd -c 'set BMC 10.0.0.5' -f ascalon.cfg
#
# The target side is the Ascalon config validated on the Atlantis FPGA
# prototype and emulator:
# the cluster's 6-bit-IR route controller TAP (asc_top.jrc) hides the
# RISC-V DTM (asc.cpu, 5-bit IR) until its 1-bit jtag_dtm_nw_enable
# register (IR 0x3) is set, and any cluster reset hides it again.

if { ![info exists BMC] } {
	set BMC wallabmc
}

adapter driver remote_bitbang
remote_bitbang host $BMC
remote_bitbang port 7777

gdb_port 3333
telnet_port 4444
tcl_port 6666

transport select jtag
# TRST is wired and the daemon can drive it, but with reset_config none
# OpenOCD resets the TAPs through TMS instead; SRST is not wired. So
# "reset" here only resets the TAPs and re-opens the DTM: reset the SoC
# through the BMC's reset or power commands.
reset_config none

jtag newtap asc cpu -irlen 5 -ignore-bypass -disable

jtag configure asc.cpu -event tap-enable {
	irscan asc_top.jrc 0x3
	drscan asc_top.jrc 1 0x1
}

jtag configure asc.cpu -event tap-disable {
	irscan asc_top.jrc 0x3
	drscan asc_top.jrc 1 0
}

jtag newtap asc_top jrc -irlen 6 -ignore-version

# One debug module, eight harts seen as gdb threads
set _TARGETNAME asc.cpu0
target create $_TARGETNAME riscv -chain-position asc.cpu -coreid 0 -rtos hwthread

$_TARGETNAME configure -event gdb-detach {
	echo "GDB detached, resuming target..."
	resume
}

# A cluster reset drops the DTM out of the chain: open it again
$_TARGETNAME configure -event reset-deassert-post {
	echo "Configuring JRC: Enabling TAP asc.cpu..."
	jtag tapenable asc.cpu
}

# The Ascalon debug module has no system bus access: keep the default
# program buffer memory access.
if { [exists -command {riscv virt2phys_mode}] } {
	riscv virt2phys_mode sw
} else {
	echo "Warning: no 'riscv virt2phys_mode' in this OpenOCD, virtual addresses need a newer one"
}
riscv set_command_timeout_sec 30

init
jtag tapenable asc.cpu
# Halting fails while the cores are still in no_fetch; stay up for telnet
if { [catch { halt } msg] } {
	echo "halt failed: $msg"
}
