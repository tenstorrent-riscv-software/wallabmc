#
# Atlantis RCPU, the SoC's management core (SoC chain JTAG0), through
# the WallaBMC bit-bang daemon. Uses the ports after the Ascalon
# defaults so both chains can be debugged at once.
#
#   openocd -c 'set BMC 10.0.0.5' -f rcpu.cfg
#
# The target side is the RCPU config validated on the Atlantis FPGA
# prototype: a plain RISC-V debug TAP with a single
# RV32 hart whose debug module offers system bus access.

if { ![info exists BMC] } {
	set BMC wallabmc
}

adapter driver remote_bitbang
remote_bitbang host $BMC
remote_bitbang port 7778

gdb_port 3334
telnet_port 4445
tcl_port 6667

transport select jtag
# TRST is wired and the daemon can drive it, but with reset_config none
# OpenOCD resets the TAPs through TMS instead; SRST is not wired. "reset"
# goes through the debug module, a full SoC reset through the BMC's
# reset or power commands.
reset_config none

set _CHIPNAME riscv
jtag newtap $_CHIPNAME cpu -irlen 5

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -chain-position $_TARGETNAME

riscv set_mem_access sysbus
gdb_report_data_abort enable

riscv set_command_timeout_sec 120

$_TARGETNAME configure -event gdb-detach {
	echo "GDB detached, resuming target..."
	resume
}

init
if { [catch { halt } msg] } {
	echo "halt failed: $msg"
}
echo "Ready for Remote Connections"
