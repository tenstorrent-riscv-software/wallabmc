# WIZnet W5500-EVB-Pico2 (RP2350A / Cortex-M33)
# Ethernet via SPI-connected W5500; no on-board RTC battery.

# The board Kconfig.defconfig sets NET_L2_ETHERNET=y automatically.

# No battery-backed RTC on this board.
CONFIG_RTC=n

# Disable features requiring hardware not yet brought up.
CONFIG_APP_NTP=n
CONFIG_APP_SENSORS=n

# Host serial bridge on UART1 (GP6 TX / GP7 RX).
CONFIG_APP_CONSOLE_LOGGER=y
CONFIG_CONSOLE_BRIDGE=y
CONFIG_APP_WEB_TERMINAL_HOST_SERIAL=y

# BMC console over USB CDC ACM (virtual serial port via USB-C)
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_UART_LINE_CTRL=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_USB_DEVICE_VID=0x2E8A
CONFIG_USB_DEVICE_PID=0x1009
CONFIG_STDOUT_CONSOLE=y

# Plain HTTP only for initial bring-up (TLS adds significant heap pressure).
CONFIG_APP_HTTPS=n

# Redfish system overview (board-specific)
CONFIG_REDFISH_SYSTEM_PRODUCT_NAME="W5500-EVB-Pico2"
CONFIG_REDFISH_SYSTEM_MANUFACTURER="WIZnet"
CONFIG_REDFISH_SYSTEM_MODEL="W5500-EVB-Pico2"
CONFIG_REDFISH_SYSTEM_PROCESSOR_MODEL="RP2350A (Cortex-M33)"
CONFIG_REDFISH_SYSTEM_PROCESSOR_COUNT=2
CONFIG_REDFISH_SYSTEM_MEMORY_GIB=0
