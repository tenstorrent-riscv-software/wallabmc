# Seeed XIAO ESP32-C6, added to boards/xiao_esp32c6_hpcore.conf by
# sysbuild.cmake when building with MCUboot.

# Firmware uploads need a larger mbedTLS heap (see MBEDTLS_HEAP_SIZE in
# Kconfig), which does not fit in SRAM next to the 160 KB system heap.
# Give 32 KB of the system heap to it.
CONFIG_HEAP_MEM_POOL_SIZE=131072
