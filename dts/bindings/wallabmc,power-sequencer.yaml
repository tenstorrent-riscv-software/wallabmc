description: |
  Host power sequencer.

  power-on-sequence lists wallabmc,power-rail nodes in the order they are
  brought up: each rail waits for its power-good inputs to read inactive,
  drives its enable active, waits for them to read active and then waits
  its settle-ms. Power off walks the list in reverse and drives every
  enable inactive; a rail with off-delay-ms is taken down that long after
  the rails listed after it. A failed power on is backed out the same way,
  rails that never came up included. The host reset GPIO (alias
  reset-gpio-1), if there is one, is asserted before the first rail comes
  up and released after the last.

  Example:

    power_sequencer: power-sequencer {
        compatible = "wallabmc,power-sequencer";
        power-on-sequence = <&p5v &vcore>;
    };

compatible: "wallabmc,power-sequencer"

include: base.yaml

properties:
  power-on-sequence:
    type: phandles
    required: true
    description: |
      The wallabmc,power-rail nodes in power-on order. Power off walks
      the list in reverse.
